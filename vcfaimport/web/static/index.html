<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VCFA Import Console</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/core.js" defer></script>
<script src="/static/skins.js" defer></script>
<script src="/static/fx.js" defer></script>
<script src="/static/views.js" defer></script>
<script src="/static/gov.js" defer></script>
<script src="/static/help.js" defer></script>
</head>
<body>
<canvas id="fx-aurora" aria-hidden="true"></canvas>
<div id="fx-grid" aria-hidden="true"></div>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg class="appicon" viewBox="0 0 64 64" aria-hidden="true"><rect class="ai-tile" x=".75" y=".75" width="62.5" height="62.5" rx="13.25"/><path class="ai-hex" stroke-width="3.5" d="M25 22.4 15 27.5 15 45.5 32 55 49 45.5 49 27.5 39 22.4"/><path class="ai-v" stroke-width="4" d="M21 11 32 23 43 11"/><rect class="ai-vm" x="24.5" y="31" width="15" height="14" rx="3"/><path class="ai-bar" stroke-width="1.9" d="M28 35.2H36M28 40.6H36"/></svg></span>
      <span class="brand-text"><b>VCFA Import</b><small>Mobility console</small></span>
    </div>
    <div class="nav-wrap"><div id="nav-glider" aria-hidden="true"></div><nav id="nav" aria-label="Main"></nav></div>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <div class="main">
    <div class="offline" id="offline" role="status" hidden><span class="spinner"></span>
      <span>Lost contact with the console. Retrying&hellip; figures on screen may be out of date. Batches already on the cluster keep running.</span></div>
    <header class="topbar" id="topbar"></header>
    <main class="view" id="view" tabindex="-1"><div class="boot">Connecting to the console…</div></main>
  </div>
</div>
<section class="dock" id="dock" hidden></section>
<div id="drawer-root"></div>
<div id="modal-root"></div>
<div id="fx-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
